<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recovery Mad Libs: Character Edition</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    body{margin:0;font-family:ui-sans-serif,system-ui;background:#0f172a;color:#e5e7eb}
    .wrap{max-width:980px;margin:24px auto;padding:0 16px}
    header{display:flex;gap:20px;padding:18px;background:#111827;border-radius:18px}
    select,button,input{background:#1e293b;color:#e5e7eb;border-radius:8px;padding:8px;margin:4px}
    .panel{background:#111827;border-radius:18px;padding:18px;margin-top:14px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .output{white-space:pre-wrap;background:#0b1225;border:1px dashed #334155;padding:16px;border-radius:14px;min-height:80px;margin-top:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="assets/logo.svg" alt="Recovery Mad Libs logo" width="120" height="120" />
      <h1>Recovery Mad Libs: Character Edition</h1>
    </header>

    <div>
      <label for="picker">Choose a story</label>
      <select id="picker">
        <option value="incident">🍿 Group Room Incident</option>
        <option value="olympics">🏅 Relapse Prevention Olympics</option>
        <option value="saturday">🎳 Saturday Special</option>
        <option value="matinee">🎬 Matinee Mayhem</option>
        <option value="family">👪 Family Therapy Gone Wild</option>
        <option value="snack">🍪 The Great Snack Heist</option>
        <option value="meditation">🧘 Meditation Meltdown</option>
        <option value="mystery">🔎 Missing Phone Mystery</option>
        <option value="talent">🎤 Treatment Talent Show</option>
        <option value="roommates">🛏️ Roommate Chronicles</option>
        <option value="graduation">🎓 Graduation Day Surprise</option>
      </select>
      <button id="randomize">🎲 Random</button>
      <button id="reveal">🎉 Reveal</button>
      <button id="reset">↺ Reset</button>
    </div>

    <!-- Panels -->
    <section id="incident" class="panel" data-story>
      <h2>🍿 Group Room Incident</h2>
      <div class="grid" data-fields>
        <label>Patient <input name="patient1"></label>
        <label>Staff <input name="staff1"></label>
        <label>Verb <input name="verb"></label>
        <label>Adjective <input name="adj"></label>
        <label>Place <input name="place"></label>
        <label>Buzzword <input name="buzz"></label>
        <label>Object <input name="object"></label>
        <label>Emotion <input name="emotion"></label>
        <label>Food <input name="food"></label>
        <label>Sound <input name="sound"></label>
      </div>
      <div class="output" id="out-incident"></div>
    </section>

    <section id="family" class="panel" data-story hidden>
      <h2>👪 Family Therapy Gone Wild</h2>
      <div class="grid" data-fields>
        <label>Patient <input name="patient1"></label>
        <label>Staff <input name="staff1"></label>
        <label>Family Member <input name="family"></label>
        <label>Verb <input name="verb"></label>
        <label>Adjective <input name="adj"></label>
        <label>Object <input name="object"></label>
        <label>Emotion <input name="emotion"></label>
        <label>Buzzword <input name="buzz"></label>
      </div>
      <div class="output" id="out-family"></div>
    </section>

    <section id="snack" class="panel" data-story hidden>
      <h2>🍪 The Great Snack Heist</h2>
      <div class="grid" data-fields>
        <label>Patient <input name="patient1"></label>
        <label>Staff <input name="staff1"></label>
        <label>Snack <input name="snack"></label>
        <label>Verb <input name="verb"></label>
        <label>Adjective <input name="adj"></label>
        <label>Object <input name="object"></label>
        <label>Place <input name="place"></label>
        <label>Emotion <input name="emotion"></label>
      </div>
      <div class="output" id="out-snack"></div>
    </section>

    <section id="meditation" class="panel" data-story hidden>
      <h2>🧘 Meditation Meltdown</h2>
      <div class="grid" data-fields>
        <label>Patient <input name="patient1"></label>
        <label>Staff <input name="staff1"></label>
        <label>Verb <input name="verb"></label>
        <label>Adjective <input name="adj"></label>
        <label>Sound <input name="sound"></label>
        <label>Object <input name="object"></label>
        <label>Emotion <input name="emotion"></label>
      </div>
      <div class="output" id="out-meditation"></div>
    </section>

    <section id="mystery" class="panel" data-story hidden>
      <h2>🔎 Missing Phone Mystery</h2>
      <div class="grid" data-fields>
        <label>Patient <input name="patient1"></label>
        <label>Staff <input name="staff1"></label>
        <label>Verb <input name="verb"></label>
        <label>Adjective <input name="adj"></label>
        <label>Place <input name="place"></label>
        <label>Object <input name="object"></label>
        <label>Emotion <input name="emotion"></label>
      </div>
      <div class="output" id="out-mystery"></div>
    </section>

    <section id="talent" class="panel" data-story hidden>
      <h2>🎤 Treatment Talent Show</h2>
      <div class="grid" data-fields>
        <label>Patient <input name="patient1"></label>
        <label>Staff <input name="staff1"></label>
        <label>Talent <input name="talent"></label>
        <label>Adjective <input name="adj"></label>
        <label>Song lyric/quote <input name="quote"></label>
        <label>Object <input name="object"></label>
        <label>Emotion <input name="emotion"></label>
      </div>
      <div class="output" id="out-talent"></div>
    </section>

    <section id="roommates" class="panel" data-story hidden>
      <h2>🛏️ Roommate Chronicles</h2>
      <div class="grid" data-fields>
        <label>Patient <input name="patient1"></label>
        <label>Staff <input name="staff1"></label>
        <label>Verb <input name="verb"></label>
        <label>Adjective <input name="adj"></label>
        <label>Object <input name="object"></label>
        <label>Emotion <input name="emotion"></label>
        <label>Place <input name="place"></label>
      </div>
      <div class="output" id="out-roommates"></div>
    </section>

    <section id="graduation" class="panel" data-story hidden>
      <h2>🎓 Graduation Day Surprise</h2>
      <div class="grid" data-fields>
        <label>Patient <input name="patient1"></label>
        <label>Staff <input name="staff1"></label>
        <label>Verb <input name="verb"></label>
        <label>Adjective <input name="adj"></label>
        <label>Object <input name="object"></label>
        <label>Emotion <input name="emotion"></label>
        <label>Food <input name="food"></label>
        <label>Sound <input name="sound"></label>
      </div>
      <div class="output" id="out-graduation"></div>
    </section>

  </div>

  <script>
    const picker=document.getElementById('picker');
    const panels=[...document.querySelectorAll('[data-story]')];
    const revealBtn=document.getElementById('reveal');
    const resetBtn=document.getElementById('reset');
    const randomBtn=document.getElementById('randomize');

    function showPanel(key){panels.forEach(p=>p.hidden=p.id!==key);} picker.addEventListener('change',()=>showPanel(picker.value)); showPanel(picker.value);

    const POOLS={
      patient:['Alex','Jordan','Taylor','Sam','Riley'],
      staff:['Trevor','Emma','Angel','Kyle','Tim'],
      family:['mom','uncle','sister','grandma'],
      verb:['launched','spilled','juggled','tripped over','hugged'],
      adj:['spectacular','chaotic','sticky','weird','legendary'],
      place:['group room','cafeteria','rec room','med line','courtyard'],
      buzz:['accountability','mindfulness','coping skills','radical honesty'],
      object:['rubber chicken','jetpack','glitter cannon','traffic cone'],
      emotion:['bewildered','triumphant','awkward','curious'],
      food:['popcorn','mystery casserole','donuts','slushie'],
      sound:['blorp-blorp','kazoo solo','wa-wa-waaa','pew-pew'],
      snack:['nachos','pretzel','blue slushie','gummy worms'],
      talent:['juggling','karaoke','interpretive dance','magic trick'],
      quote:['That was amazing!','Encore!','Drop the mic!']
    };

    function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

    randomBtn.addEventListener('click',()=>{
      const panel=panels.find(p=>!p.hidden); if(!panel)return;
      panel.querySelectorAll('input').forEach(i=>{
        if(i.value) return;
        switch(i.name){
          case 'patient1': i.value=pick(POOLS.patient); break;
          case 'staff1': i.value=pick(POOLS.staff); break;
          case 'family': i.value=pick(POOLS.family); break;
          case 'verb': i.value=pick(POOLS.verb); break;
          case 'adj': i.value=pick(POOLS.adj); break;
          case 'place': i.value=pick(POOLS.place); break;
          case 'buzz': i.value=pick(POOLS.buzz); break;
          case 'object': i.value=pick(POOLS.object); break;
          case 'emotion': i.value=pick(POOLS.emotion); break;
          case 'food': i.value=pick(POOLS.food); break;
          case 'sound': i.value=pick(POOLS.sound); break;
          case 'snack': i.value=pick(POOLS.snack); break;
          case 'talent': i.value=pick(POOLS.talent); break;
          case 'quote': i.value=pick(POOLS.quote); break;
        }
      });
    });

    function reveal(){
      const id=picker.value; const p=document.getElementById(id);
      const v=Object.fromEntries([...p.querySelectorAll('input')].map(i=>[i.name,i.value]));
      let text="";
      switch(id){
        case 'incident': text=`Yesterday, ${v.patient1} and ${v.staff1} were in the ${v.place} when things got out of hand. Someone ${v.verb} a ${v.object}, and the group gasped. It was the most ${v.adj} moment of the week. The counselor shouted “${v.buzz}!” but it didn’t help—the room filled with the smell of ${v.food} and the sound of ${v.sound}. Everyone felt ${v.emotion}.`; break;
        case 'family': text=`In family therapy, ${v.patient1} and their ${v.family} argued until ${v.staff1} ${v.verb} a ${v.object}. It was ${v.adj}, everyone felt ${v.emotion}, and someone shouted “${v.buzz}!”.`; break;
        case 'snack': text=`The snack heist began when ${v.patient1} saw ${v.staff1} ${v.verb} a ${v.snack}. Suddenly a ${v.object} appeared in the ${v.place}, making things ${v.adj}. Everyone felt ${v.emotion}.`; break;
        case 'meditation': text=`During meditation, ${v.patient1} ${v.verb} a ${v.object}, causing a ${v.sound}. The vibe turned ${v.adj} while ${v.staff1} tried to help. Everyone felt ${v.emotion}.`; break;
        case 'mystery': text=`In the ${v.place}, ${v.patient1} accused ${v.staff1} after someone ${v.verb} a ${v.object}. It was ${v.adj}, and the whole group felt ${v.emotion}.`; break;
        case 'talent': text=`At the talent show, ${v.patient1} watched ${v.staff1} perform ${v.talent} with a ${v.object}. It was ${v.adj}. Someone shouted “${v.quote}!” and the crowd felt ${v.emotion}.`; break;
        case 'roommates': text=`Roommates ${v.patient1} and ${v.staff1} ${v.verb} over a ${v.object} in the ${v.place}. It turned ${v.adj} until both felt ${v.emotion}.`; break;
        case 'graduation': text=`At graduation, ${v.patient1} and ${v.staff1} ${v.verb} a ${v.object}. The ${v.food} went flying, a ${v.sound} echoed, and it felt ${v.adj}. Everyone was ${v.emotion}.`; break;
      }
      p.querySelector('.output').textContent=text;
    }
    revealBtn.addEventListener('click',reveal);

    function resetVisible(){const p=panels.find(p=>!p.hidden);if(!p)return;p.querySelectorAll('input').forEach(i=>i.value='');p.querySelector('.output').textContent='';}
    resetBtn.addEventListener('click',resetVisible);
  </script>
</body>
</html>
